name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Generate icons
        run: java -cp target/classes com.runcat.util.IconGenerator src/main/resources/icons

      - name: Rebuild JAR with resources
        run: mvn clean package -B

      - name: Build EXE with jpackage
        run: |
          $VERSION = "1.2.0"
          jpackage --type app-image `
            --name JavaRunCat `
            --input target `
            --main-jar "java-runcat-$VERSION.jar" `
            --main-class com.runcat.RunCatApp `
            --app-version $VERSION `
            --vendor "JavaRunCat Team" `
            --description "A cute running cat animation on your Windows taskbar" `
            --icon src/main/resources/icons/app-icon.ico `
            --java-options "--enable-native-access=ALL-UNNAMED" `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Dsun.jnu.encoding=UTF-8" `
            --dest dist

      - name: Zip EXE distribution
        run: Compress-Archive -Path dist/JavaRunCat -DestinationPath JavaRunCat-Windows-x64.zip

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-runcat-jar
          path: target/java-runcat-1.2.0.jar

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: java-runcat-exe
          path: JavaRunCat-Windows-x64.zip

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: java-runcat-jar
          path: ./release-assets

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: java-runcat-exe
          path: ./release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
